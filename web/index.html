<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Hello</title>
    <style>
      body {
        font-family: Arial;
        text-align: center;
        padding: 50px;
      }
      button {
        padding: 15px 30px;
        font-size: 18px;
      }
      #state {
        margin-top: 20px;
        color: green;
      }
      #coordinates {
        position: fixed;
        bottom: 10px;
        right: 10px;
        padding: 10px;
        background-color: #333;
        color: #fff;
        border-radius: 5px;
      }
      canvas {
        border: 1px solid black;
        width: 560px;
        height: 360px;
      }
    </style>
  </head>
  <body>
    <h1>Press the Button</h1>

    <button id="volumeUpBtn">Volume Up</button>
    <button id="volumeDownBtn">Volume Down</button>
    <button id="muteVolumeBtn">Mute</button>
    <canvas id="canvas" width="560" height="360"></canvas>
    <script src="/js/app.js"></script>
  </body>
</html>
