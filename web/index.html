<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/styles.css" />
    <title>Hello</title>
  </head>
  <body>
    <div class="button-container">
      <button id="volumeUpBtn">🔊</button>
      <button id="volumeDownBtn">🔉</button>
      <button id="muteVolumeBtn">🔇</button>
      <div id="keyboardContainer">
        <input
          type="text"
          id="keyboardInput"
          placeholder="⌨️"
          autocomplete="off"
          autocorrect="off"
          spellcheck="false"
        />
      </div>
    </div>

    <canvas id="touchpad" width="560" height="360"></canvas>

    <div class="touchpad-buttons">
      <button id="leftClickBtn">LClick</button>
      <button id="rightClickBtn">RClick</button>
    </div>

    <script src="/js/app.js"></script>
  </body>
</html>
