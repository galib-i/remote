<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/styles.css" />
    <title>Hello</title>
  </head>
  <body>
    <div class="button-container">
      <button id="volumeUpBtn">Volume Up</button>
      <button id="volumeDownBtn">Volume Down</button>
      <button id="muteVolumeBtn">Mute</button>
      <button id="leftClickBtn">LClick</button>
      <button id="rightClickBtn">RClick</button>
    </div>

    <div id="keyboardContainer">
      <input
        type="text"
        id="keyboardInput"
        placeholder="Type here to send keys..."
      />
    </div>

    <canvas id="touchpad" width="560" height="360"></canvas>
    <script src="/js/app.js"></script>
  </body>
</html>
