name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Compile Binaries
        run: |
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/remote-server-linux ./cmd/server
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o dist/remote-server-windows.exe ./cmd/server

      - uses: actions/upload-artifact@v7
        with:
          name: remote-server-builds
          path: dist/